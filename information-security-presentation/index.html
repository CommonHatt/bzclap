"Жүйені қорғау үшін алдымен қандай ресурстар маңызды екенін анықтау қажет. Одан кейін ықтимал қауіптер, осал тұстар және олардың салдары бағаланады. Мысалы, мектептің электрондық журналында бағалардың өзгермеуі аса маңызды, ал банк жүйесінде төлем жазбаларының дәлдігі шешуші рөл атқарады. Сондықтан қорғаныс шаралары жүйенің мақсатына сәйкес таңдалады. Бір ғана антивирус барлық мәселені шешпейді: сенімді қорғаныс бірнеше өзара байланысты бақылаудан құралады."]],
